<rect x="50" y="895" width="1180" height="44" rx="8" fill="#f1f5f9"/>
<text x="66" y="913" font-size="13" fill="#475569">关键点：模板 DAG 是只读基准；每次下发全量复制出独立实例 DAG（草稿可改，改动不回写模板）；答卷与明细只绑定实例，保证历史答卷结构永远稳定。</text>
<text x="66" y="931" font-size="13" fill="#475569">防环：模板保存、草稿保存、下发三个时机用递归 CTE 校验；防重复边：(instance_id, from_node, to_node, condition) 唯一约束。</text>
