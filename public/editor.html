<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>问卷编辑器 · 智能问卷</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <!-- page-editor：本页整体按 70% 缩放（见 app.css），字号与间距一起缩小 -->
  <body class="page-editor">
    <header class="topbar">
      <div class="brand">智能问卷</div>
      <nav id="nav" class="nav"></nav>

      <div class="topbar-controls">
        <label class="field">
          <span>当前用户</span>
          <select id="user-select"></select>
        </label>
        <button id="btn-publish" class="btn btn-primary" hidden>
          发布为正式模板
        </button>
      </div>
    </header>

    <div id="toast" class="toast" hidden></div>

    <!--
      三栏布局：最左 AI 对话、中间**只放节点图**、最右节点面板。
      列表信息已压缩进右栏的「本问卷结构」清单里。
    -->
    <main class="editor-layout-3">
      <!-- ============ 左：AI 对话 ============ -->
      <section class="panel chat-panel">
        <div class="panel-head">
          <h2>AI 助手</h2>
          <span id="chat-status" class="badge">未打开</span>
        </div>

        <div id="chat-log" class="chat-log">
          <p class="hint">
            先新建或加载一个**模板草稿**，然后在这里描述你要做的问卷。<br /><br />
            例如：「做一个无人机黑飞核查问卷，问是否拥有无人机、有没有飞过、
            在哪里飞过，还要记录型号」。<br /><br />
            AI 的改动会直接落到**当前打开的这个草稿版本**上，
            中间的节点图会同步刷新 —— 你也可以随时手工改。
          </p>
        </div>

        <form id="chat-form" class="chat-form">
          <textarea
            id="chat-input"
            rows="3"
            placeholder="描述你要改什么…（Enter 发送，Shift+Enter 换行）"
          ></textarea>
          <button id="chat-send" class="btn btn-primary" type="submit">
            发送
          </button>
        </form>
      </section>

      <!-- ============ 中：节点图（唯一视图） ============ -->
      <section class="panel editor-main">
        <div class="panel-head">
          <h2 id="editor-title">问卷编辑器</h2>
          <div class="panel-head-right">
            <span id="editor-status" class="badge">未打开</span>
          </div>
        </div>

        <div class="toolbar editor-toolbar">
          <button id="btn-new" class="btn btn-sm">+ 新建模板</button>
          <button id="btn-load" class="btn btn-sm">加载模板</button>
          <button id="btn-save-draft" class="btn btn-sm">保存为草稿</button>
        </div>

        <div id="editor-hint" class="editor-banner" hidden></div>

        <div id="editor-graph" class="editor-graph"></div>
      </section>

      <!-- ============ 右：节点面板 ============ -->
      <section class="panel node-panel">
        <div class="panel-head">
          <h2>节点</h2>
        </div>
        <div id="node-palette" class="node-palette">
          <p class="hint">载入中…</p>
        </div>

        <div class="panel-head">
          <h2>本问卷结构</h2>
        </div>
        <div id="node-outline" class="node-outline">
          <p class="hint">载入中…</p>
        </div>

        <div class="panel-head">
          <h2>概况</h2>
        </div>
        <div id="editor-stats" class="meta-grid"></div>

        <div id="editor-side" class="editor-side"></div>
      </section>
    </main>

    <script type="module" src="/editor.js"></script>
  </body>
</html>
