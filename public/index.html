<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>下发问卷 · 智能问卷</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">智能问卷</div>
      <nav id="nav" class="nav"></nav>

      <div class="topbar-controls">
        <label class="field">
          <span>当前用户</span>
          <select id="user-select"></select>
        </label>
        <label class="field grow">
          <span>搜索模板</span>
          <input id="search-input" placeholder="按模板名称搜索，回车即查" />
        </label>
        <button id="btn-search" class="btn btn-primary">搜索</button>
      </div>
    </header>

    <div id="toast" class="toast" hidden></div>

    <main class="manage-layout">
      <!-- ============ 左：选模板 ============ -->
      <section class="panel">
        <div class="panel-head">
          <h2>选择模板</h2>
          <span id="count-badge" class="badge">-</span>
        </div>

        <div id="pick-list" class="pick-list">
          <p class="hint">载入中…</p>
        </div>

        <div class="pager">
          <button id="btn-prev" class="btn btn-sm">上一页</button>
          <span id="page-info" class="hint">-</span>
          <button id="btn-next" class="btn btn-sm">下一页</button>
        </div>
      </section>

      <!-- ============ 右：建案件 ============ -->
      <section class="panel">
        <div class="panel-head">
          <h2>新建案件</h2>
          <span id="picked-badge" class="badge">未选择模板</span>
        </div>

        <div id="detail-body" class="detail">
          <p class="hint">从左侧选一个模板，然后填案件标题即可创建。</p>
        </div>

        <div class="form-row">
          <label class="field grow">
            <span>案件标题</span>
            <input id="title-input" placeholder="例如：张三 - 无人机黑飞核查" />
          </label>
          <button id="btn-create" class="btn btn-primary" disabled>创建案件</button>
        </div>
      </section>
    </main>

    <script type="module" src="/dispatch.js"></script>
  </body>
</html>
